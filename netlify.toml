# Netlify deploy config — safe defaults for this repo's gotchas:
#  - bun.lock is detected automatically -> `bun install` (no package-lock committed)
#  - .npmrc legacy-peer-deps covers the fallback if npm is used (esbuild ERESOLVE)
#  - Node pinned to 22 (Vite 8 requires ^20.19.0 || >=22.12.0; older build images default to 18)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: static files take precedence over this rewrite unless forced,
# so /sw.js, /manifest.webmanifest and hashed assets keep serving normally.
# Netlify routes /.netlify/functions/* (the AI proxy, ask.mjs) BEFORE redirect
# rules, so this catch-all does not shadow the function.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must never be HTTP-cached hard, or clients get stuck on an
# old app shell. Correct MIME type for the PWA manifest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
