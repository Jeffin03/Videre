  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path d="M96 256c64-84 112-112 160-112s96 28 160 112c-64 84-112 112-160 112s-96-28-160-112z"
          fill="none" stroke="#14161a" stroke-width="34" stroke-linejoin="round"/>
