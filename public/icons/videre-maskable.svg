<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Videre">
  <defs>
    <linearGradient id="videre-maskable-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background: survives Android's circular/squircle masking -->
  <rect width="512" height="512" fill="url(#videre-maskable-gradient)"/>
